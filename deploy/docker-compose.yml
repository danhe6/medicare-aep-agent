# On the Nebius VM:  cd medicare-aep-agent/deploy && DOMAIN=<ip-with-dashes>.sslip.io docker compose up -d --build
services:
  app:
    build: ..
    restart: unless-stopped
    env_file: ../.env            # NEBIUS_API_KEY, TAVILY_API_KEY, GITHUB_TOKEN (read-only, for the private data release)
    environment:
      - TRACE_LOG=0              # never write conversations to disk in production
    volumes:
      - data:/app/data
    expose: ["8000"]
  caddy:                          # HTTPS (Let's Encrypt) in front of the app; the microphone needs https
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
volumes:
  data:
  caddy_data:
